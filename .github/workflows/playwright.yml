name: Playwright Tests
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:ui-hotel
        env:
          CI: true
          TA_EMAIL: dummy
          TA_PASSWORD: dummy
          SLACK_BOT_TOKEN: dummy
          DWS_URL: dummy
          DWS_EMAIL: dummy
          DWS_PASSWORD: dummy
          REPORTS_PATH: dummy
          JIRA_BASE_URL: dummy
          JIRA_API_TOKEN: dummy
          JIRA_EMAIL: dummy
          JIRA_PROJECT: dummy

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload GitHub Pages artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy:
    name: Deploy Playwright Report to GitHub Pages
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Report Link to Workflow Summary
        run: |
          echo "### 📊 Playwright Report" >> $GITHUB_STEP_SUMMARY
          echo "View the live report here: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
