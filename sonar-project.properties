sonar.projectKey=playwright-demo
sonar.projectName=Playwright Demo
sonar.sourceEncoding=UTF-8

# Source code paths
sonar.sources=src
sonar.tests=src/tests

# TypeScript specific configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Test file patterns
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/test-results/**,**/playwright-report/**,**/allure-results/**,**/coverage/**,**/.github/**
